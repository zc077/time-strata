<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间地层 · CHRONO-SEDIMENT</title>
<link rel="icon" type="image/x-icon" href="assets/chrono-icon.ico">
<style>
/* ============================================================
   色彩体系 · 地质岩层与发光晶石 (Geological Strata & Luminescent Minerals)
   ============================================================ */
:root {
  --abyss-0:      #050709;   /* 深渊核心岩层 */
  --abyss-1:      #0a0e13;   /* 上覆基岩 */
  --abyss-2:      #121820;   /* 沉积碎屑层 */
  --strata-line:  rgba(214, 186, 130, 0.12); /* 地层分界等高线 */
  --strata-gold:  #d8be85;   /* 金矿脉络 */
  
  /* 三种矿物切片专属晶体发光色 */
  --gem-book:     #81bac5;   /* 書 · 玄武硅酸岩 / 幽青冷光 */
  --gem-book-glow:rgba(82, 141, 153, 0.35);
  
  --gem-movie:    #e07a38;   /* 影 · 感光琥珀晶 / 暖金熔岩光 */
  --gem-movie-glow:rgba(224, 122, 56, 0.4);
  
  --gem-game:     #3bb896;   /* 遊 · 嵌金导电琉璃 / 翡翠辉光 */
  --gem-game-glow:rgba(59, 184, 150, 0.38);
  --gem-anime:    #b6a0df;

  --text-pure:    #f5f7fa;   /* 晶簇白 */
  --text-slate:   #b0bbc9;   /* 泥页岩灰 */
  --text-dark:    #8e9baa;   /* 次要标本信息 */
  --seal-red:     #e63929;   /* 勘测朱印红 */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--abyss-0);
  color: var(--text-pure);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
  line-height: 1.8;
  letter-spacing: 0.04em;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

/* ============================================================
   宏观背景 · 地质等高线与深渊沉积流
   ============================================================ */
.geological-backdrop {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 1;
  background: 
    radial-gradient(ellipse at 80% 20%, rgba(82, 141, 153, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 20% 70%, rgba(224, 122, 56, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, #050709 0%, #090d12 40%, #06090d 100%);
}

.strata-contours {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 2;
  opacity: 0.35;
  background-image: 
    repeating-linear-gradient(178deg, transparent, transparent 180px, rgba(214, 186, 130, 0.03) 180px, rgba(214, 186, 130, 0.03) 181px),
    radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(255,255,255,0.015) 46%, transparent 47%);
}

.mineral-grain {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 3;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* ============================================================
   深度标尺 & 地质跃迁电梯 (Stratum Elevator Sidebar)
   ============================================================ */
.depth-gauge-sidebar {
  position: fixed;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 18px 10px;
  background: rgba(10, 14, 18, 0.5);
  border: 1px solid rgba(216, 190, 133, 0.15);
  border-radius: 30px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.depth-readout {
  writing-mode: vertical-rl;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  color: var(--strata-gold);
  opacity: 0.8;
}

.depth-meter-line {
  width: 1px;
  height: 120px;
  background: linear-gradient(180deg, transparent, var(--strata-gold), transparent);
  position: relative;
}

.depth-indicator-bubble {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 7px; height: 7px;
  background: var(--strata-gold);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--strata-gold);
  transition: top 0.2s ease-out;
  top: 0%;
}

/* 地层年份快速电梯按钮群 */
.elevator-checkpoints {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}

.elevator-node {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(216, 190, 133, 0.2);
  color: var(--text-slate);
  font-family: -apple-system, BlinkMacSystemFont, monospace;
  font-size: 0.65rem;
  padding: 4px 6px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.elevator-node:hover, .elevator-node.active {
  background: rgba(216, 190, 133, 0.2);
  color: var(--strata-gold);
  border-color: var(--strata-gold);
  box-shadow: 0 0 10px rgba(216, 190, 133, 0.25);
  transform: translateX(3px);
}

.elevator-count-dot {
  font-size: 0.55rem;
  opacity: 0.6;
}

/* ============================================================
   主视域容器
   ============================================================ */
.chrono-core-view {
  position: relative;
  z-index: 10;
  max-width: 1080px;
  margin: 0 auto;
  padding: 64px 40px 100px 110px; /* 左侧留出深度计空间 */
}

/* 顶端基石台头 */
.strata-header {
  text-align: center;
  margin-bottom: 44px;
  position: relative;
}

.header-geo-tag {
  font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
  font-size: 0.68rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--strata-gold);
  opacity: 0.85;
  margin-bottom: 12px;
  display: inline-block;
  padding: 3px 14px;
  border: 1px solid rgba(216, 190, 133, 0.25);
  border-radius: 20px;
  background: rgba(18, 24, 32, 0.4);
}

.main-chrono-title {
  font-size: 3.2rem;
  font-weight: 400;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  color: #fff;
  text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  margin-bottom: 14px;
}

.sub-chrono-manifesto {
  font-size: 0.92rem;
  color: var(--text-slate);
  letter-spacing: 0.16em;
  max-width: 540px;
  margin: 0 auto;
  font-weight: 300;
}

/* ============================================================
   光谱控制台 (Spectrum Deck with Sonar Search & Density Switch)
   ============================================================ */
.spectrum-control-deck {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  margin-bottom: 38px;
  padding: 18px 20px;
  background: rgba(14, 19, 26, 0.65);
  border: 1px solid rgba(216, 190, 133, 0.18);
  border-radius: 18px;
  backdrop-filter: blur(18px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  gap: 14px;
}

/* 晶矿形态分类器 */
.mineral-type-pills {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mineral-pill {
  background: none;
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-slate);
  font-family: inherit;
  font-size: 0.875rem;
  letter-spacing: 0.14em;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.mineral-pill .ore-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: var(--text-dark);
  transition: all 0.25s;
}

.mineral-pill[data-type="all"].active .ore-dot { background: var(--strata-gold); box-shadow: 0 0 8px var(--strata-gold); }
.mineral-pill[data-type="book"].active .ore-dot { background: var(--gem-book); box-shadow: 0 0 8px var(--gem-book); }
.mineral-pill[data-type="movie"].active .ore-dot { background: var(--gem-movie); box-shadow: 0 0 8px var(--gem-movie); }
.mineral-pill[data-type="game"].active .ore-dot { background: var(--gem-game); box-shadow: 0 0 8px var(--gem-game); }

.mineral-pill:hover {
  color: #fff;
  border-color: rgba(255,255,255,0.25);
  transform: translateY(-2px);
}

.mineral-pill.active {
  color: #fff;
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.3);
}

/* 右侧工具群：声呐搜索、视图密度切换、开采按钮 */
.control-deck-tools {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  padding-top: 14px;
  border-top: 1px solid rgba(216, 190, 133, 0.12);
}

/* 声呐检索输入框 */
.sonar-search-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  min-width: 0;
}

.sonar-search-input {
  background: rgba(8, 12, 16, 0.7);
  border: 1px solid rgba(216, 190, 133, 0.25);
  border-radius: 20px;
  padding: 9px 48px 9px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
  width: 100%;
  outline: none;
  transition: all 0.3s;
}

.sonar-search-input:focus {
  border-color: var(--strata-gold);
  box-shadow: 0 0 0 3px rgba(216, 190, 133, 0.12);
  background: rgba(14, 18, 24, 0.95);
}

.sonar-shortcut-hint {
  position: absolute;
  right: 12px;
  font-family: -apple-system, BlinkMacSystemFont, monospace;
  font-size: 0.72rem;
  color: var(--text-dark);
  pointer-events: none;
}

/* 视图密度切换器 (Density Switcher: 展厅 vs 标本抽屉) */
.density-switcher-group {
  display: flex;
  background: rgba(8, 12, 16, 0.8);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 2px;
}

.density-btn {
  background: none;
  border: none;
  color: var(--text-slate);
  font-family: inherit;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  padding: 8px 12px;
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.2s;
}

.density-btn.active {
  background: rgba(216, 190, 133, 0.2);
  color: var(--strata-gold);
}

.mine-specimen-btn {
  background: linear-gradient(135deg, rgba(216, 190, 133, 0.25) 0%, rgba(216, 190, 133, 0.1) 100%);
  border: 1px solid var(--strata-gold);
  color: var(--strata-gold);
  font-family: inherit;
  font-size: 0.875rem;
  letter-spacing: 0.16em;
  padding: 9px 18px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: none;
}
.mine-specimen-btn:hover {
  background: var(--strata-gold);
  color: #050709;
  box-shadow: 0 0 24px rgba(216, 190, 133, 0.45);
  transform: scale(1.03);
}

/* ============================================================
   开采与结晶表单 (Specimen Mining Form)
   ============================================================ */
.mining-chamber-form {
  display: none;
  background: rgba(14, 20, 28, 0.9);
  border: 1px solid var(--strata-gold);
  border-radius: 16px;
  padding: 34px 38px;
  margin-bottom: 50px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(216, 190, 133, 0.15);
  animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

.mining-chamber-form.open {
  display: block;
}

.form-head-title {
  text-align: center;
  color: var(--strata-gold);
  font-size: 1.05rem;
  letter-spacing: 0.2em;
  margin-bottom: 22px;
}

.geo-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.geo-input, .geo-select, .geo-textarea {
  width: 100%;
  padding: 11px 15px;
  background: rgba(8, 11, 15, 0.85);
  border: 1px solid rgba(216, 190, 133, 0.2);
  border-radius: 6px;
  color: var(--text-pure);
  font-family: inherit;
  font-size: 0.82rem;
  outline: none;
  transition: all 0.25s;
}
.geo-input:focus, .geo-select:focus, .geo-textarea:focus {
  border-color: var(--strata-gold);
  box-shadow: 0 0 14px rgba(216, 190, 133, 0.25);
  background: rgba(14, 18, 24, 0.95);
}

.crystallize-submit-btn {
  width: 100%;
  background: linear-gradient(90deg, #d8be85 0%, #b59b5d 100%);
  color: #06080a;
  border: none;
  padding: 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.25s;
}
.crystallize-submit-btn:hover {
  filter: brightness(1.15);
  box-shadow: 0 0 25px rgba(216, 190, 133, 0.4);
}

/* ============================================================
   垂直时间地层流 (The Stratigraphic Timeline)
   ============================================================ */
.sediment-timeline-stream {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 52px;
}

/* 年份地层带 (Geological Stratum Band) */
.stratum-epoch-band {
  position: relative;
  transition: all 0.4s ease;
}

/* 地层年份标志栏 (可点击折叠/展开) */
.epoch-strata-marker {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
  cursor: pointer;
  user-select: none;
  padding: 6px 0;
  transition: opacity 0.2s;
}
.epoch-strata-marker:hover {
  opacity: 0.85;
}

.epoch-year-num {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", monospace;
  font-size: 1.8rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  color: #fff;
  text-shadow: 0 0 20px rgba(216, 190, 133, 0.3);
}

.epoch-geological-layer-name {
  font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
  font-size: 0.75rem;
  color: var(--strata-gold);
  letter-spacing: 0.25em;
  opacity: 0.9;
}

.epoch-fold-hint {
  font-size: 0.75rem;
  color: var(--text-dark);
  letter-spacing: 0.1em;
  border: 1px solid rgba(255,255,255,0.08);
  padding: 2px 8px;
  border-radius: 12px;
}

.epoch-horizon-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--strata-gold) 0%, rgba(216, 190, 133, 0.1) 60%, transparent 100%);
}

/* ============================================================
   视图形态 A：【宏观展厅模式】 (Gallery Mode)
   ============================================================ */
.specimen-slabs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
  transition: all 0.35s ease;
}

.mineral-slab {
  position: relative;
  height: 330px;
  border-radius: 18px;
  cursor: pointer;
  perspective: 1000px;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, opacity 0.3s ease;
}

.slab-core {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(15, 20, 26, 0.6);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: all 0.4s ease;
}

.slab-core::before {
  content: "";
  position: absolute;
  top: -50%; left: -50%; width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.025) 48%, rgba(255, 255, 255, 0.06) 50%, transparent 54%);
  transform: rotate(25deg);
  pointer-events: none;
  transition: transform 0.6s ease;
}

.mineral-slab:hover {
  transform: translateY(-4px);
}
.mineral-slab:hover .slab-core::before {
  transform: rotate(25deg) translate(30%, 30%);
}

/* 切片色彩变体 */
.slab-book .slab-core {
  border-color: rgba(82, 141, 153, 0.3);
  background: radial-gradient(circle at 10% 10%, rgba(82, 141, 153, 0.25) 0%, rgba(10, 14, 18, 0.8) 75%);
}
.slab-book:hover { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 14px var(--gem-book-glow); }
.slab-book:hover .slab-core { border-color: var(--gem-book); }
.slab-book .specimen-type-chip { color: var(--gem-book); border-color: rgba(82, 141, 153, 0.4); }

.slab-movie .slab-core {
  border-color: rgba(224, 122, 56, 0.3);
  background: radial-gradient(circle at 90% 10%, rgba(224, 122, 56, 0.25) 0%, rgba(14, 12, 10, 0.8) 75%);
}
.slab-movie:hover { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 14px var(--gem-movie-glow); }
.slab-movie:hover .slab-core { border-color: var(--gem-movie); }
.slab-movie .specimen-type-chip { color: var(--gem-movie); border-color: rgba(224, 122, 56, 0.4); }

.slab-game .slab-core {
  border-color: rgba(59, 184, 150, 0.3);
  background: radial-gradient(circle at 50% 90%, rgba(59, 184, 150, 0.25) 0%, rgba(10, 16, 14, 0.8) 75%);
}
.slab-game:hover { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 14px var(--gem-game-glow); }
.slab-game:hover .slab-core { border-color: var(--gem-game); }
.slab-game .specimen-type-chip { color: var(--gem-game); border-color: rgba(59, 184, 150, 0.4); }

.slab-header-meta { display: flex; justify-content: space-between; align-items: center; }
.specimen-type-chip {
  font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid;
  background: rgba(0,0,0,0.3);
}
.specimen-coord-id {
  font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
  font-size: 0.72rem;
  color: var(--text-dark);
  letter-spacing: 0.1em;
}

.slab-body { margin: auto 0; }
.slab-title {
  font-size: 1.5rem;
  font-weight: 400;
  color: #fff;
  letter-spacing: 0.08em;
  line-height: 1.35;
  margin-bottom: 8px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
.slab-creator {
  font-size: 0.875rem;
  color: var(--text-slate);
  letter-spacing: 0.1em;
  margin-bottom: 16px;
}
.slab-vein-quote {
  font-size: 0.875rem;
  color: rgba(245, 247, 250, 0.85);
  line-height: 1.8;
  font-style: italic;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  border-left: 2px solid var(--strata-gold);
  padding-left: 10px;
}

.slab-footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.slab-strata-season { font-size: 0.75rem; color: var(--text-dark); letter-spacing: 0.06em; }
.miner-seal-stamp {
  font-size: 0.72rem;
  font-family: "Songti SC", serif;
  color: var(--strata-gold);
  border: 1px solid rgba(216, 190, 133, 0.4);
  padding: 2px 6px;
  border-radius: 2px;
  background: rgba(216, 190, 133, 0.06);
}

/* ============================================================
   视图形态 B：【密集矿标抽屉模式】 (Cabinet Matrix Mode)
   ============================================================ */
.cabinet-view-mode .specimen-slabs-grid {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}

.cabinet-view-mode .mineral-slab {
  height: 164px;
  border-radius: 10px;
}

.cabinet-view-mode .slab-core {
  padding: 16px;
  border-radius: 10px;
}

.cabinet-view-mode .slab-title {
  font-size: 1rem;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cabinet-view-mode .slab-creator {
  font-size: 0.8rem;

<script>
/* ============================================================
   丰富地质数据集 (优先从 /api/records 加载)
   ============================================================ */
const EXPANDED_GEOLOGICAL_DATA = [];

let globalSpecimens = [];
let activeTypeFilter = 'all';
let activeStatusFilter = 'all';
let apiAvailable = false;
let inspectedItemId = null;
const pendingStatusIds = new Set();
const { statuses, normalizeStatus, statusLabels } = Tracking;
let isCabinetMode = false;
let collapsedYears = new Set();
let searchQuery = '';

async function initStratumData() {
  try {
    const res = await fetch('/api/records');
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Invalid records');
    globalSpecimens = data;
    apiAvailable = true;
  } catch {
    globalSpecimens = EXPANDED_GEOLOGICAL_DATA;
    showLibraryFeedback('未连接到本地服务。请启动服务并刷新页面。', true);
  }
  renderStrataStream();
}

function showLibraryFeedback(message, isError = false) {
  const feedback = document.getElementById('libraryFeedback');
  feedback.textContent = message;
  feedback.classList.toggle('error', isError);
  feedback.hidden = false;
}

function getTypeFilteredSpecimens() {
  return globalSpecimens.filter(item => activeTypeFilter === 'all' || item.type === activeTypeFilter);
}

function getVisibleSpecimens() {
  return getTypeFilteredSpecimens().filter(item => activeStatusFilter === 'all' || normalizeStatus(item.status) === activeStatusFilter);
}

function renderStatusFilters() {
  const records = getTypeFilteredSpecimens();
  const labels = { all: '全部状态', ...statusLabels(activeTypeFilter) };
  const group = document.getElementById('statusFilters');
  group.replaceChildren();
  for (const status of ['all', ...statuses]) {
    const count = status === 'all' ? records.length : records.filter(item => normalizeStatus(item.status) === status).length;
    const button = document.createElement('button');
    button.className = `tracking-tab ${status === activeStatusFilter ? 'active' : ''}`;
    button.dataset.status = status;
    button.setAttribute('aria-pressed', String(status === activeStatusFilter));
    button.innerHTML = `${labels[status]} <span class="tracking-count">${count}</span>`;
    button.addEventListener('click', () => {
      activeStatusFilter = status;
      renderStrataStream();
      document.querySelector(`.tracking-tab[data-status="${status}"]`).focus();
    });
    group.appendChild(button);
  }
}

/* ============================================================
   地质跃迁电梯 (Stratum Elevator & Mini-map)
   ============================================================ */
const elevatorNodes = document.getElementById('elevatorNodes');

function buildElevatorNodes() {
  elevatorNodes.innerHTML = '';
  const visible = getVisibleSpecimens();
  const years = [...new Set(visible.map(i => i.year || 'unknown'))].sort((a, b) => (Number(b) || 0) - (Number(a) || 0));

  years.forEach(yr => {
    const count = visible.filter(i => (i.year || 'unknown') === yr).length;
    const node = document.createElement('div');
    node.className = 'elevator-node';
    node.dataset.year = yr;
    node.innerHTML = `<span>${yr === 'unknown' ? '时间未定' : yr}</span><span class="elevator-count-dot">(${count})</span>`;
    
    node.addEventListener('click', () => {
      const targetBand = document.getElementById(`band-${yr}`);
      if (targetBand) {
        targetBand.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    elevatorNodes.appendChild(node);
  });
}

/* ============================================================
   垂直地层渲染引擎 (Strata Rendering Engine)
   ============================================================ */
const timelineStream = document.getElementById('timelineStream');

function renderStrataStream() {
  timelineStream.innerHTML = '';
  renderStatusFilters();
  buildElevatorNodes();

  const filtered = getVisibleSpecimens();

  if (filtered.length === 0) {
    timelineStream.innerHTML = `
      <div class="library-empty">
        <strong>这里还没有作品</strong>
        点击「记录作品」添加，或切换分类和状态看看。
      </div>`;
    return;
  }

  // 按年份降序分组
  const epochGroups = {};
  filtered.forEach(item => {
    const yr = item.year || 'unknown';
    if (!epochGroups[yr]) epochGroups[yr] = [];
    epochGroups[yr].push(item);
  });

  const years = Object.keys(epochGroups).sort((a, b) => (Number(b) || 0) - (Number(a) || 0));

  years.forEach((year, index) => {
    const band = document.createElement('div');
    const isCollapsed = collapsedYears.has(year);
    band.className = `stratum-epoch-band ${isCollapsed ? 'collapsed' : ''}`;
    band.id = `band-${year}`;
    band.dataset.year = year;

    const depthMeters = index * 120;
    const epochNames = ["全新统浅表沉淀层", "上新统凝灰岩带", "古近纪玄武基底", "白垩纪深沉岩床", "古生代深邃矿层"];
    const epochLabel = epochNames[index % epochNames.length];
    const itemCount = epochGroups[year].length;

    band.innerHTML = `
      <div class="epoch-strata-marker" title="点击折叠或展开本年度地质带">
        <span class="epoch-year-num">${year === 'unknown' ? '时间未定' : year}</span>
        <span class="epoch-geological-layer-name">DEPTH -${depthMeters}M // ${epochLabel}</span>
        <span class="epoch-fold-hint">${isCollapsed ? '▲ 展开 (' + itemCount + ')' : '▼ 收拢'}</span>
        <div class="epoch-horizon-line"></div>
      </div>
      <div class="specimen-slabs-grid" id="grid-${year}"></div>
    `;

    // 点击年份地标折叠/展开
    const marker = band.querySelector('.epoch-strata-marker');
    marker.addEventListener('click', () => {
      if (collapsedYears.has(year)) collapsedYears.delete(year);
      else collapsedYears.add(year);
      renderStrataStream();
    });

    timelineStream.appendChild(band);

    if (!isCollapsed) {
      const grid = band.querySelector(`#grid-${year}`);
      epochGroups[year].forEach(specimen => {
        const slab = createMineralSlab(specimen);
        grid.appendChild(slab);
      });
    }
  });

  if (!isCabinetMode) {
    bind3DTilt();
  }

  // 如果当前有搜索词，立即执行声呐扫描高亮
  if (searchQuery) {
    executeSonarHighlight(searchQuery);
  }
}

/* 创建单块矿石切片 */
function createMineralSlab(item) {
  const el = document.createElement('div');
  el.className = `mineral-slab slab-${item.type}`;
  el.dataset.id = item.id;
  el.dataset.title = (item.title || '').toLowerCase();
  el.dataset.author = (item.author || '').toLowerCase();
  el.dataset.tags = (item.tags || []).join(',').toLowerCase();
  el.dataset.contributor = (item.contributor || '').toLowerCase();
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `查看作品：${item.title}`);
  const status = normalizeStatus(item.status);
  
  const typeMap = {
    anime: { label: "紫晶标本 // 番剧", color: "var(--gem-anime)" },
    book: { label: "玄武透光石 // 书籍", color: "var(--gem-book)" },
    movie: { label: "感光琥珀晶 // 影视", color: "var(--gem-movie)" },
    game: { label: "嵌金导电琉璃 // 游戏", color: "var(--gem-game)" }
  };
  const typeInfo = typeMap[item.type] || { label: "未知晶矿", color: "#fff" };

  el.innerHTML = `
    <div class="slab-core">
      <div class="slab-header-meta">
        <span class="specimen-type-chip">${typeInfo.label}</span>
        <span class="specimen-coord-id">#${item.id.toString().slice(-4)}</span>
      </div>
      <div class="slab-body">
        <h3 class="slab-title">${item.title}</h3>
        ${item.author ? `<p class="slab-creator">${item.author}</p>` : ''}
        <span class="tracking-badge ${status}">${statusLabels(item.type)[status]}</span>
        ${item.excerpt ? `<p class="slab-vein-quote">“${item.excerpt}”</p>` : ''}
      </div>
      <div class="slab-footer">
        <span class="slab-strata-season">${item.releaseMonth ? `${item.year}年${item.releaseMonth}月 · ${item.season}季` : item.year ? `${item.year} ${item.season}季沉降` : '时间未定'}</span>
        <span class="miner-seal-stamp">${item.contributor || '佚名探矿师'} 钤</span>
      </div>
    </div>
  `;

  el.addEventListener('click', () => openInspectionModal(item, typeInfo));
  el.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openInspectionModal(item, typeInfo);
    }
  });
  return el;
}

/* ============================================================
   3D 物理倾角跟随交互 (3D Slab Tilt Effect)
   ============================================================ */
function bind3DTilt() {
  document.querySelectorAll('.mineral-slab').forEach(slab => {
    slab.addEventListener('mousemove', (e) => {
      const rect = slab.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      
      const tiltX = (y / (rect.height / 2)) * -12;
      const tiltY = (x / (rect.width / 2)) * 12;

      slab.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(1.03, 1.03, 1.03) translateY(-8px)`;
    });

    slab.addEventListener('mouseleave', () => {
      slab.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1) translateY(0px)';
    });
  });
}

/* ============================================================
   声呐光谱瞬移搜寻 (Sonar Instant Search)
   ============================================================ */
const sonarInput = document.getElementById('sonarInput');

function executeSonarHighlight(q) {
  const query = q.trim().toLowerCase();
  const slabs = document.querySelectorAll('.mineral-slab');
  
  if (!query) {
    slabs.forEach(s => {
      s.classList.remove('sonar-dimmed', 'sonar-matched');
    });
    return;
  }

  slabs.forEach(slab => {
    const isMatch = slab.dataset.title.includes(query) ||
                    slab.dataset.author.includes(query) ||
                    slab.dataset.tags.includes(query) ||
                    slab.dataset.contributor.includes(query);

    if (isMatch) {
      slab.classList.add('sonar-matched');
      slab.classList.remove('sonar-dimmed');
    } else {
      slab.classList.add('sonar-dimmed');
      slab.classList.remove('sonar-matched');
    }
  });
}

sonarInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  executeSonarHighlight(searchQuery);
});

// Cmd+K / Ctrl+K 快捷呼出
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    sonarInput.focus();
    sonarInput.select();
  }
});

/* ============================================================
   密度切换器联动 (Density Switcher: 展厅 vs 标本抽屉)
   ============================================================ */
const btnViewGallery = document.getElementById('btnViewGallery');
const btnViewCabinet = document.getElementById('btnViewCabinet');
const mainContainer = document.getElementById('mainContainer');

btnViewGallery.addEventListener('click', () => {
  isCabinetMode = false;
  btnViewGallery.classList.add('active');
  btnViewCabinet.classList.remove('active');
  mainContainer.classList.remove('cabinet-view-mode');
  renderStrataStream();
});

btnViewCabinet.addEventListener('click', () => {
  isCabinetMode = true;
  btnViewCabinet.classList.add('active');
  btnViewGallery.classList.remove('active');
  mainContainer.classList.add('cabinet-view-mode');
  renderStrataStream();
});

/* ============================================================
   分类筛选联动
   ============================================================ */
const typePills = document.getElementById('typePills');
typePills.addEventListener('click', (e) => {
  const pill = e.target.closest('.mineral-pill');
  if (!pill) return;
  document.querySelectorAll('.mineral-pill').forEach(p => {
    p.classList.remove('active');
    p.setAttribute('aria-pressed', 'false');
  });
  pill.classList.add('active');
  pill.setAttribute('aria-pressed', 'true');
  activeTypeFilter = pill.dataset.type;
  renderStrataStream();
});

/* ============================================================
   显微透光台交互 (Inspection Lightbox Modal)
   ============================================================ */
const lightboxCurtain = document.getElementById('lightboxCurtain');
const monolithPayload = document.getElementById('monolithPayload');
const dismissLightboxBtn = document.getElementById('dismissLightboxBtn');

function openInspectionModal(item, typeInfo) {
  inspectedItemId = item.id;
  const status = normalizeStatus(item.status);
  const labels = statusLabels(item.type);
  const ratingScore = Math.max(0, Math.min(5, Number(item.rating) || 0));
  const stars = '✦ '.repeat(ratingScore) + '✧ '.repeat(5 - ratingScore);

  monolithPayload.innerHTML = `
    <span class="monolith-type-badge" style="color:${typeInfo.color}; border-color:${typeInfo.color};">
      ${typeInfo.label}
    </span>
    <h2 class="monolith-title">${item.title}</h2>
    <div class="monolith-strata-metrics">
      ${item.author ? `<span>造物者: ${item.author}</span><span>·</span>` : ''}
      <span>${item.releaseMonth ? `首播 / 上映：${item.year}年${item.releaseMonth}月 · ${item.season}季` : item.year ? `${item.year}年 · ${item.season}季层` : '首播 / 上映时间未定'}</span>
      ${ratingScore > 0 && status === 'completed' ? `<span class="monolith-starlight-rating">${stars}</span>` : ''}
    </div>

    <div class="tracking-editor">
      <p class="tracking-editor-label">我的进度 · 点击状态即可保存</p>
      <div class="tracking-actions" role="group" aria-label="修改作品状态">
        ${statuses.map(value => `<button class="status-action ${value === status ? 'active' : ''}" data-status="${value}" aria-pressed="${value === status}" ${apiAvailable && !pendingStatusIds.has(item.id) ? '' : 'disabled'}>${labels[value]}</button>`).join('')}
      </div>
      <p class="tracking-feedback" id="trackingFeedback" role="status" aria-live="polite">${pendingStatusIds.has(item.id) ? '正在保存…' : ''}</p>
    </div>

    ${item.excerpt ? `<div class="monolith-crystal-quote">“ ${item.excerpt} ”</div>` : ''}

    <div class="monolith-analysis-note">
      ${item.note || '地质勘探员未留下特别注疏。晶格纯正，折射自然。'}
    </div>

    <div class="monolith-specimen-pedigree">
      <div class="monolith-tag-constellation">
        ${(item.tags || []).map(t => `<span class="monolith-tag"># ${t}</span>`).join('')}
      </div>
      <div class="explorer-cinnabar-signet">
        <span>${item.contributor || '佚名探矿师'}</span>
        <span style="font-size:0.55rem;opacity:0.8;font-weight:normal;margin-top:2px;">开采定标</span>
      </div>
    </div>
  `;

  monolithPayload.querySelectorAll('.status-action').forEach(button => {
    button.addEventListener('click', () => saveSpecimenStatus(item, typeInfo, button.dataset.status));
  });

  lightboxCurtain.classList.add('open');
}

async function saveSpecimenStatus(item, typeInfo, status) {
  if (!apiAvailable || pendingStatusIds.has(item.id) || normalizeStatus(item.status) === status) return;
  pendingStatusIds.add(item.id);
  let failure = '';
  const buttons = [...monolithPayload.querySelectorAll('.status-action')];
  const feedback = document.getElementById('trackingFeedback');
  buttons.forEach(button => { button.disabled = true; });
  feedback.classList.remove('error');
  feedback.textContent = '正在保存…';
  try {
    const response = await fetch(`/api/records/${encodeURIComponent(item.id)}/status`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '状态保存失败，请重试。');
    item.status = result.status;
    renderStrataStream();
    showLibraryFeedback(`状态已保存：${item.title} · ${statusLabels(item.type)[normalizeStatus(item.status)]}`);
  } catch (error) {
    failure = `保存失败，状态未更改。${error.message}`;
    showLibraryFeedback('状态保存失败，请检查本地服务后重试。', true);
  } finally {
    pendingStatusIds.delete(item.id);
    buttons.forEach(button => { button.disabled = false; });
    if (inspectedItemId === item.id) {
      openInspectionModal(item, typeInfo);
      const currentFeedback = document.getElementById('trackingFeedback');
      currentFeedback.classList.toggle('error', Boolean(failure));
      currentFeedback.textContent = failure || '已保存，刷新后仍会保留。';
      monolithPayload.querySelector(`.status-action[data-status="${normalizeStatus(item.status)}"]`).focus();
    }
  }
}

function closeLightbox() {
  lightboxCurtain.classList.remove('open');
  inspectedItemId = null;
}

dismissLightboxBtn.addEventListener('click', closeLightbox);
lightboxCurtain.addEventListener('click', (e) => {
  if (e.target === lightboxCurtain) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightboxCurtain.classList.contains('open')) closeLightbox();
});

/* ============================================================
   标本注入开采处理 (Mining Form Handlers)
   ============================================================ */
const openMiningChamberBtn = document.getElementById('openMiningChamberBtn');
const miningChamber = document.getElementById('miningChamber');
const submitCrystallizeBtn = document.getElementById('submitCrystallizeBtn');
const inType = document.getElementById('inType');
const inStatus = document.getElementById('inStatus');

function updateNewStatusOptions() {
  const selected = inStatus.value || 'planned';
  const labels = statusLabels(inType.value);
  inStatus.innerHTML = statuses.map(status => `<option value="${status}">${labels[status]}</option>`).join('');
  inStatus.value = selected;
}
inType.addEventListener('change', updateNewStatusOptions);
updateNewStatusOptions();

openMiningChamberBtn.addEventListener('click', () => {
  miningChamber.classList.toggle('open');
  if (miningChamber.classList.contains('open')) {
    if (activeTypeFilter !== 'all') {
      inType.value = activeTypeFilter;
      updateNewStatusOptions();
    }
    document.getElementById('inTitle').focus();
  }
});

submitCrystallizeBtn.addEventListener('click', async () => {
  if (!apiAvailable) {
    showLibraryFeedback('请连接本地服务并刷新后再保存作品。', true);
    return;
  }
  const title = document.getElementById('inTitle').value.trim();
  const author = document.getElementById('inAuthor').value.trim();
  const contributor = document.getElementById('inContributor').value.trim();

  if (!title || !author || !contributor) {
    alert('请填写标本题名、造物者，并留下您的探矿师钤印署名。');
    return;
  }

  const type = document.getElementById('inType').value;
  const season = document.getElementById('inSeason').value;
  const tagsRaw = document.getElementById('inTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(/[,，、]/).map(t => t.trim()).filter(Boolean) : ['新矿标本'];
  const excerpt = document.getElementById('inExcerpt').value.trim();
  const note = document.getElementById('inNote').value.trim();

  const newSpecimen = {
    id: Date.now(),
    type, title, author, season, status: inStatus.value, rating: 0, tags, excerpt, note, contributor,
    year: new Date().getFullYear()
  };

  submitCrystallizeBtn.textContent = "正在保存…";
  submitCrystallizeBtn.disabled = true;

  try {
    const res = await fetch('/api/records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newSpecimen)
    });
    const saved = await res.json();
    if (!res.ok) throw new Error(saved.error || '作品保存失败');
    globalSpecimens.unshift(saved);
  } catch (error) {
    showLibraryFeedback(`作品未保存，请重试。${error.message}`, true);
    return;
  } finally {
    submitCrystallizeBtn.disabled = false;
    submitCrystallizeBtn.textContent = '保存作品 · 沉入地层';
  }

  activeTypeFilter = type;
  activeStatusFilter = newSpecimen.status;
  document.querySelectorAll('.mineral-pill').forEach(pill => {
    pill.classList.toggle('active', pill.dataset.type === type);
    pill.setAttribute('aria-pressed', String(pill.dataset.type === type));
  });
  renderStrataStream();
  miningChamber.classList.remove('open');
  showLibraryFeedback(`作品已保存：${title} · ${statusLabels(type)[newSpecimen.status]}`);
  
  // 清空表单
  document.getElementById('inTitle').value = '';
  document.getElementById('inAuthor').value = '';
  document.getElementById('inExcerpt').value = '';
  document.getElementById('inNote').value = '';
  document.getElementById('inTags').value = '';
  inStatus.value = 'planned';
});

/* ============================================================
   深度计游标与电梯高亮跟随 (Depth Gauge & Elevator Highlight)
   ============================================================ */
const depthBubble = document.getElementById('depthBubble');
const currentStratumLabel = document.getElementById('currentStratumLabel');

window.addEventListener('scroll', () => {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const progress = Math.min(1, Math.max(0, window.scrollY / (maxScroll || 1)));
  
  if (depthBubble) {
    depthBubble.style.top = `${progress * 100}%`;
  }

  const depthVal = Math.round(progress * 600);
  if (currentStratumLabel) {
    currentStratumLabel.textContent = `STRATUM -${depthVal}M`;
  }

  // 动态高亮左侧电梯节点
  const bands = document.querySelectorAll('.stratum-epoch-band');
  let currentYear = null;
  bands.forEach(band => {
    const rect = band.getBoundingClientRect();
    if (rect.top <= window.innerHeight * 0.45 && rect.bottom >= 0) {
      currentYear = band.dataset.year;
    }
  });

  if (currentYear) {
    document.querySelectorAll('.elevator-node').forEach(node => {
      if (node.dataset.year === currentYear) node.classList.add('active');
      else node.classList.remove('active');
    });
  }
}, { passive: true });

// 启动初始化
initStratumData();
</script>
